name: Context ablation

on:
  workflow_call:
    inputs:
      scope:
        type: string
        required: true
      protocol:
        type: string
        required: false
        default: benchmarks/context-ablation/protocol.json
    secrets:
      CPA_API_KEY:
        required: true
      CPA_SSH_PRIVATE_KEY:
        required: true
      CPA_SSH_KNOWN_HOSTS:
        required: true
      CPA_LEASE_TOKEN:
        required: true

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}/src
  ABLATION_PROTOCOL: ${{ inputs.protocol }}
  ABLATION_SCOPE: ${{ inputs.scope }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen SDK and test dependencies
        run: python -m pip install -c requirements/agent.txt -e '.[agent,dev,semantic]'
      - name: Check strategy isolation and frozen experiment contracts
        run: >-
          python -m pytest -q tests/test_context_optimization.py
          tests/test_context_diagnostics.py tests/test_context_read_dedup.py
          tests/test_context_runtime_evidence.py
          tests/test_context_state_projection.py tests/test_context_estimate_reporting.py
          tests/test_context_trigger_audit.py tests/test_context_trigger_campaign.py
          tests/test_context_ablation.py
      - name: Freeze execution matrix
        id: plan
        run: >-
          python scripts/context_ablation.py plan
          --protocol "$ABLATION_PROTOCOL" --scope "$ABLATION_SCOPE"
          --output .repropatch/context-plan.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: context-plan-${{ github.run_id }}
          path: .repropatch/context-plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  attempt:
    name: ${{ matrix.job_key }} / ${{ matrix.instance_id }} / ${{ matrix.arm }} / r${{ matrix.repeat }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      ATTEMPT_ID: ${{ matrix.attempt_id }}
      TRIAL_KEY: ${{ matrix.job_key }}
      INSTANCE: ${{ matrix.instance_id }}
      ARM: ${{ matrix.arm }}
      REPEAT: ${{ matrix.repeat }}
      CPA_JOB_MEMBER: ${{ matrix.job_key }}
      CPA_SSH_KEY_FILE: ${{ github.workspace }}/.repropatch/ssh/identity
      CPA_SSH_KNOWN_HOSTS_FILE: ${{ github.workspace }}/.repropatch/ssh/known_hosts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen Agent environment
        run: python -m pip install -c requirements/agent.txt -e '.[agent,semantic]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: context-plan-${{ github.run_id }}
          path: .repropatch/plan
      - name: Restore verified qualification and prepare native baseline
        id: prepare
        run: >-
          python -u scripts/context_ablation.py prepare
          --protocol "$ABLATION_PROTOCOL" --scope "$ABLATION_SCOPE"
          --manifest .repropatch/plan/context-plan.json
          --attempt-id "$ATTEMPT_ID" --output .repropatch/context-attempt
      - name: Install dedicated SSH identity
        env:
          SSH_KEY: ${{ secrets.CPA_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPA_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 .repropatch/ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > "$CPA_SSH_KEY_FILE"
          printf '%s\n' "$KNOWN_HOSTS" > "$CPA_SSH_KNOWN_HOSTS_FILE"
      - name: Execute frozen attempt and independent cold scoring
        id: execute
        env:
          OPENAI_API_KEY: ${{ secrets.CPA_API_KEY }}
          CPA_LEASE_TOKEN: ${{ secrets.CPA_LEASE_TOKEN }}
        run: >-
          python -u scripts/context_ablation.py run
          --protocol "$ABLATION_PROTOCOL" --scope "$ABLATION_SCOPE"
          --manifest .repropatch/plan/context-plan.json
          --attempt-id "$ATTEMPT_ID" --output .repropatch/context-attempt
      - name: Preserve attempt status and summary
        if: always()
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          RUNNER_JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          raw = Path('.repropatch/context-attempt')
          summary = Path('.repropatch/context-summary')
          raw.mkdir(parents=True, exist_ok=True)
          summary.mkdir(parents=True, exist_ok=True)
          path = raw / 'runner-status.json'
          status = json.loads(path.read_text()) if path.is_file() else {}
          manifest_path = Path('.repropatch/plan/context-plan.json')
          manifest = json.loads(manifest_path.read_text()) if manifest_path.is_file() else {}
          workflow = {
              'attempt_id': os.environ['ATTEMPT_ID'],
              'job_key': os.environ['TRIAL_KEY'],
              'instance_id': os.environ['INSTANCE'],
              'arm': os.environ['ARM'],
              'repeat': int(os.environ['REPEAT']),
              'scope': os.environ['ABLATION_SCOPE'],
              'source_commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'prepare': os.environ['PREPARE_OUTCOME'],
              'execute': os.environ['EXECUTE_OUTCOME'],
              'job_status': os.environ['RUNNER_JOB_STATUS'],
          }
          status.update({
              **workflow,
              'schema': 'repropatch.context-ablation.runner-status.v1',
              'manifest_sha256': manifest.get('manifest_sha256'),
              'state': status.get('state', 'WORKFLOW_FAILED'),
              'workflow': workflow,
          })
          for folder in (raw, summary):
              (folder / 'runner-status.json').write_text(json.dumps(status, indent=2) + '\n')
          if (raw / 'summary.json').is_file():
              shutil.copyfile(raw / 'summary.json', summary / 'summary.json')
          shutil.copyfile(os.environ['ABLATION_PROTOCOL'], raw / 'protocol.json')
          PY
      - name: Archive full evidence with file hashes
        if: always()
        run: >-
          python scripts/actions_benchmark.py pack
          --source .repropatch/context-attempt
          --output .repropatch/context-attempt.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: context-raw-${{ github.run_id }}-${{ matrix.job_key }}
          path: |
            .repropatch/context-attempt.tar.gz
            .repropatch/context-attempt.tar.gz.sha256
            .repropatch/context-attempt.tar.metadata.json
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: context-summary-${{ github.run_id }}-${{ matrix.job_key }}
          path: .repropatch/context-summary/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  aggregate:
    if: always() && needs.plan.result == 'success'
    needs: [plan, attempt]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: context-plan-${{ github.run_id }}
          path: .repropatch/plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: context-summary-${{ github.run_id }}-*
          path: .repropatch/context-summaries
      - name: Aggregate complete, failed and missing attempts
        run: >-
          python scripts/context_ablation.py aggregate
          --protocol "$ABLATION_PROTOCOL" --scope "$ABLATION_SCOPE"
          --manifest .repropatch/plan/context-plan.json
          --source .repropatch/context-summaries --output .repropatch/context-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: context-results-${{ github.run_id }}
          path: .repropatch/context-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
