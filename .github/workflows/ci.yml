name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['docs/*.md', 'docs/evidence/**/*.json', 'specs/**', 'benchmarks/**', '*.md', 'RELEASE.json']
  pull_request:
    paths-ignore: ['docs/*.md', 'docs/evidence/**/*.json', 'specs/**', 'benchmarks/**', '*.md', 'RELEASE.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  python-and-cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts && ruff format --check src tests scripts
      - run: pytest -m 'not docker and not sdk' --junitxml=.repropatch/ci-evidence/python/results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-cpp-evidence
          path: .repropatch/ci-evidence/python/
          include-hidden-files: true
          retention-days: 7
  sdk-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements/agent.txt -e '.[agent,dev]' cmake==4.4.4
      - run: pytest -m sdk --junitxml=.repropatch/ci-evidence/sdk/results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-contract-evidence
          path: .repropatch/ci-evidence/sdk/
          include-hidden-files: true
          retention-days: 7
  docker-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements/agent.txt -e '.[agent,dev]'
      - name: Run real Docker gate
        run: >-
          python scripts/check_docker_gate.py --build
          --output .repropatch/ci-evidence/docker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-gate-evidence
          path: .repropatch/ci-evidence/docker/
          include-hidden-files: true
          retention-days: 7
  context-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install fixed Responses and mini environments
        run: |
          python -m venv .repropatch/agent-env
          .repropatch/agent-env/bin/python -m pip install -c requirements/agent.txt -e '.[agent]'
          git init --template= -q .repropatch/mini-source
          git -C .repropatch/mini-source fetch --depth=1 https://github.com/SWE-agent/mini-swe-agent.git 04d809ceab9df28f9adaed044884180159172930
          git -C .repropatch/mini-source checkout --detach FETCH_HEAD
          python -m venv .repropatch/mini-env
          .repropatch/mini-env/bin/python -m pip install -c requirements/formal-mini.txt -e . litellm==1.106.1 httpx2==2.16.0 mcp==2.3.0 mcp-types==2.3.0 rich jinja2 tenacity python-dotenv platformdirs
      - name: Verify native mini compaction with local responses
        run: >-
          .repropatch/mini-env/bin/python scripts/check_mini_compaction.py
          --mini-source .repropatch/mini-source
          --output .repropatch/ci-evidence/context/mini
      - name: Verify pinned Codex binary and native local compaction
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, pathlib, tarfile, urllib.request
          p = json.load(open('benchmarks/comparison-full-24-protocol.json'))
          data = urllib.request.urlopen(p['codex_tarball'], timeout=120).read()
          assert 'sha512-' + base64.b64encode(hashlib.sha512(data).digest()).decode() == p['codex_tarball_integrity']
          target = pathlib.Path('.repropatch/codex'); target.mkdir()
          with tarfile.open(fileobj=io.BytesIO(data)) as archive: archive.extractall(target, filter='data')
          binary = pathlib.Path(p['codex_binary'])
          assert hashlib.sha256(binary.read_bytes()).hexdigest() == p['codex_sha256']
          assert hashlib.sha256(binary.with_name('codex-code-mode-host').read_bytes()).hexdigest() == p['code_host_sha256']
          PY
          .repropatch/agent-env/bin/python scripts/check_codex_compaction.py --binary .repropatch/codex/package/vendor/x86_64-unknown-linux-musl/bin/codex --output .repropatch/ci-evidence/context/codex
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: context-native-evidence
          path: |
            .repropatch/ci-evidence/context/mini/
            .repropatch/ci-evidence/context/codex/*.json
            .repropatch/ci-evidence/context/codex/*.jsonl
            .repropatch/ci-evidence/context/codex/*.sqlite3
            .repropatch/ci-evidence/context/codex/stderr.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
