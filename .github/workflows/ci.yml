name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python-and-cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts && ruff format --check src tests scripts
      - run: pytest -m 'not docker and not sdk' --junitxml=.repropatch/ci-evidence/python/results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-cpp-evidence
          path: .repropatch/ci-evidence/python/
          include-hidden-files: true
          retention-days: 7
  sdk-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements/agent.txt -e '.[agent,dev]' cmake==4.4.4
      - run: pytest -m sdk --junitxml=.repropatch/ci-evidence/sdk/results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-contract-evidence
          path: .repropatch/ci-evidence/sdk/
          include-hidden-files: true
          retention-days: 7
  docker-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements/agent.txt -e '.[agent,dev]'
      - name: Run real Docker gate
        run: >-
          python scripts/check_docker_gate.py --build
          --output .repropatch/ci-evidence/docker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-gate-evidence
          path: .repropatch/ci-evidence/docker/
          include-hidden-files: true
          retention-days: 7
