name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python-and-cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts && ruff format --check src tests scripts
      - run: pytest --junitxml=.repropatch/ci-evidence/python/results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-cpp-evidence
          path: .repropatch/ci-evidence/python/
          include-hidden-files: true
          retention-days: 7
  docker-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Record execution identity
        run: |
          mkdir -p .repropatch/ci-evidence/docker
          git rev-parse HEAD > .repropatch/ci-evidence/docker/environment.txt
          docker version >> .repropatch/ci-evidence/docker/environment.txt
      - run: docker build -t repropatch-cpp:0.1 -f docker/Dockerfile docker
      - name: Record image identity
        run: docker image inspect --format '{{.Id}}' repropatch-cpp:0.1 >> .repropatch/ci-evidence/docker/environment.txt
      - name: Run real Docker gate
        run: >-
          REPROPATCH_DOCKER_TESTS=1 pytest -m docker -v
          --basetemp=.repropatch/ci-evidence/docker/tests
          --junitxml=.repropatch/ci-evidence/docker/results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-gate-evidence
          path: .repropatch/ci-evidence/docker/
          include-hidden-files: true
          retention-days: 7
