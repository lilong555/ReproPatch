name: Cross repository C++ benchmark

on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true
      instances:
        type: string
        required: true
      protocol:
        type: string
        required: false
        default: 'benchmarks/cross-repo/development-protocol.json'
      image:
        type: string
        required: false
        default: ''
    secrets:
      CPA_API_KEY:
        required: false
      CPA_SSH_PRIVATE_KEY:
        required: false
      CPA_SSH_KNOWN_HOSTS:
        required: false
      CPA_LEASE_TOKEN:
        required: false

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  rescore-plan:
    if: inputs.stage == 'rescore'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      source_run: ${{ steps.plan.outputs.source_run }}
      source_protocol: ${{ steps.plan.outputs.source_protocol }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: plan
        env:
          CONFIG: ${{ inputs.protocol }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path(os.environ['CONFIG']).read_text())
          assert p['model_requests'] == 0 and type(p['source_run_id']) is int
          source = json.loads(Path(p['source_protocol']).read_text())
          known = {(a['instance_id'], a['arm']) for a in source['attempts']}
          assert all((a['instance_id'], a['arm']) in known for a in p['attempts'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('matrix=' + json.dumps({'include': p['attempts']}) + '\n')
              stream.write('source_run=' + str(p['source_run_id']) + '\n')
              stream.write('source_protocol=' + p['source_protocol'] + '\n')
          PY

  rescore-attempt:
    needs: rescore-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.rescore-plan.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      INSTANCE: ${{ matrix.instance_id }}
      ARM: ${{ matrix.arm }}
      SOURCE_RUN: ${{ needs.rescore-plan.outputs.source_run }}
      SOURCE_PROTOCOL: ${{ needs.rescore-plan.outputs.source_protocol }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.rescore-plan.outputs.source_run }}
          name: cross-attempt-${{ needs.rescore-plan.outputs.source_run }}-${{ matrix.instance_id }}-${{ matrix.arm }}
          path: .repropatch/rescore-input
      - name: 冻结候选冷评分
        run: >-
          python -u scripts/rescore_cross_attempt.py --archive .repropatch/rescore-input/cross-attempt.tar.gz
          --protocol "$SOURCE_PROTOCOL" --instance "$INSTANCE" --arm "$ARM" --source-run "$SOURCE_RUN"
          --output .repropatch/rescore --summary .repropatch/rescore-summary
      - name: 保存冷评分证据
        if: always()
        run: >-
          python scripts/actions_benchmark.py pack --source .repropatch/rescore
          --output .repropatch/rescore.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cross-rescore-${{ github.run_id }}-${{ matrix.instance_id }}-${{ matrix.arm }}
          path: |
            .repropatch/rescore.tar.gz
            .repropatch/rescore.tar.gz.sha256
            .repropatch/rescore-summary/
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

  toolchain:
    if: inputs.stage == 'qualify'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      image: ${{ steps.image.outputs.image }}
      image_id: ${{ steps.image.outputs.image_id }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 固定零模型资格批次
        id: plan
        env:
          STAGE: ${{ inputs.stage }}
          INSTANCES: ${{ inputs.instances }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$STAGE" = qualify
          python -m pip install -e . -r requirements/cpp-sources.txt
          python scripts/cpp_sources.py --output .repropatch/cross-inputs --index .repropatch/candidate-index.json
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from cpp_sources import load_records
          from cpp_native_adapter import OPTIONS
          ids = os.environ['INSTANCES'].split(',')
          records = {r['instance_id']: r for r in load_records(Path('.repropatch/cross-inputs'))}
          assert len(ids) <= 35 and len(set(ids)) == len(ids)
          assert all(i in records and records[i]['org'] + '/' + records[i]['repo'] in OPTIONS for i in ids)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('matrix=' + json.dumps({'instance': ids}) + '\n')
          PY
      - name: 准备离线依赖
        if: inputs.image == ''
        run: python scripts/prepare_cpp_toolchain.py --output .repropatch/cross-tools --pool .repropatch/cross-git
      - name: 构建并冻结共享工具链
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          FROZEN_IMAGE: ${{ inputs.image }}
        run: |
          if test -n "$FROZEN_IMAGE"; then
            python - <<'PY'
          import os, re
          assert re.fullmatch(r'ghcr\.io/lilong555/repropatch-cross-cpp@sha256:[a-f0-9]{64}', os.environ['FROZEN_IMAGE'])
          PY
            image="$FROZEN_IMAGE"
            docker pull "$image"
          else
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            image="ghcr.io/${GITHUB_REPOSITORY,,}-cross-cpp:run-$GITHUB_RUN_ID"
            docker build -f docker/cross-repository.Dockerfile -t "$image" .
            docker push "$image"
          fi
          digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          identity=$(docker image inspect "$image" --format '{{.Id}}')
          mkdir -p .repropatch/cross-environment
          IMAGE="$digest" IMAGE_ID="$identity" python - <<'PY'
          import json, os, pathlib, subprocess
          metadata = {'image': os.environ['IMAGE'], 'image_id': os.environ['IMAGE_ID'], 'execution_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'model_requests': 0}
          pathlib.Path('.repropatch/cross-environment/image.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          echo "image_id=$identity" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cross-inputs-${{ github.run_id }}
          path: |
            .repropatch/cross-inputs/
            .repropatch/cross-environment/
          include-hidden-files: true
          retention-days: 14

  qualification:
    if: inputs.stage == 'qualify'
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.toolchain.outputs.matrix) }}
    env:
      INSTANCE: ${{ matrix.instance }}
      IMAGE: ${{ needs.toolchain.outputs.image }}
      IMAGE_ID: ${{ needs.toolchain.outputs.image_id }}
      REPROPATCH_BATCH_ID: cross-${{ github.run_id }}-${{ matrix.instance }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cross-inputs-${{ github.run_id }}
          path: .repropatch/
      - name: 拉取固定工具链
        run: docker pull "$IMAGE"
      - name: 复用同环境原生验收并登记任务
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/reuse_native_qualification.py
          --plan benchmarks/cross-repo/formal-preparation.json
          --dataset .repropatch/cross-inputs --instance "$INSTANCE"
          --image-id "$IMAGE_ID" --output .repropatch/cross-qualification
      - name: O3 基线检查与参考补丁冷验收
        if: steps.reuse.outputs.reused != 'true'
        run: >-
          python -u scripts/qualify_cross_repo.py
          --dataset .repropatch/cross-inputs --repository .repropatch/cross-git
          --instances "$INSTANCE" --backend docker --image "$IMAGE_ID"
          --output .repropatch/cross-qualification
      - name: 核验原始证据
        if: always()
        run: |
          if test -f .repropatch/cross-qualification/batch-summary.json; then
            python scripts/verify_qualification_evidence.py --batch .repropatch/cross-qualification --output .repropatch/cross-audit
          fi
      - name: 打包全部阶段记录
        if: always()
        run: |
          mkdir -p .repropatch/cross-qualification
          python scripts/actions_benchmark.py pack --source .repropatch/cross-qualification --output .repropatch/cross-evidence.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cross-evidence-${{ github.run_id }}-${{ matrix.instance }}
          path: |
            .repropatch/cross-evidence.tar.gz
            .repropatch/cross-evidence.tar.gz.sha256
            .repropatch/cross-evidence.tar.metadata.json
            .repropatch/cross-audit/
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
      - name: 下载后核验归档 SHA
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cross-evidence-$GITHUB_RUN_ID-$INSTANCE" --dir .repropatch/roundtrip
          python - <<'PY'
          import hashlib, pathlib
          local = pathlib.Path('.repropatch/cross-evidence.tar.gz')
          remote = pathlib.Path('.repropatch/roundtrip/cross-evidence.tar.gz')
          assert hashlib.file_digest(local.open('rb'), 'sha256').digest() == hashlib.file_digest(remote.open('rb'), 'sha256').digest()
          PY

  paid-plan:
    if: inputs.stage == 'development' || inputs.stage == 'formal' || inputs.stage == 'repeat' || inputs.stage == 'infrastructure-revalidation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      parallel: ${{ steps.plan.outputs.parallel }}
    env:
      GH_TOKEN: ${{ github.token }}
      CROSS_PROTOCOL: ${{ inputs.protocol }}
      CROSS_STAGE: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: 核验冻结协议、完整 CI 与独立 Attempt 配额
        id: plan
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from cross_repo_campaign import validate_protocol
          p = json.loads(Path(os.environ['CROSS_PROTOCOL']).read_text())
          validate_protocol(p)
          assert p['phase'] == os.environ['CROSS_STAGE']
          subprocess.run(['git', 'merge-base', '--is-ancestor', p['execution_source_commit'], os.environ['GITHUB_SHA']], check=True)
          ci = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{p['ci_run_id']}"]))
          assert ci['conclusion'] == 'success' and ci['head_sha'] == p['execution_source_commit'] and ci['name'] == 'CI'
          calibration = p['network_calibration']
          directory = Path('.repropatch/network-calibration')
          subprocess.run(['gh', 'run', 'download', str(calibration['run_id']), '--repo', os.environ['GITHUB_REPOSITORY'], '--name', calibration['artifact'], '--dir', str(directory)], check=True)
          import hashlib
          report = directory / 'calibration.json'
          assert hashlib.sha256(report.read_bytes()).hexdigest() == calibration['sha256']
          data = json.loads(report.read_text())
          assert data['status'] == 'PASSED' and data['usage']['issued_requests'] == 12 and data['reasoning_effort'] == 'max'
          if p['phase'] == 'formal':
              from cross_repo_campaign import development_selection
              gate = p['selection_gate']['development']
              destination = Path('.repropatch/development-results')
              subprocess.run(['gh', 'run', 'download', str(gate['run_id']), '--repo', os.environ['GITHUB_REPOSITORY'], '--name', gate['artifact'], '--dir', str(destination)], check=True)
              results = destination / 'results.json'
              assert hashlib.sha256(results.read_bytes()).hexdigest() == gate['results_sha256']
              decision = development_selection(json.loads(results.read_text()), gate['tasks'])
              assert decision['difficulty_counts'] == gate['difficulty_counts'] and decision['all_pass'] == gate['all_pass']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('matrix=' + json.dumps({'include': p['attempts']}) + '\n')
              stream.write('parallel=' + str(p['max_parallel']) + '\n')
          PY

  paid-attempt:
    needs: paid-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.paid-plan.outputs.parallel) }}
      matrix: ${{ fromJSON(needs.paid-plan.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      INSTANCE: ${{ matrix.instance_id }}
      ARM: ${{ matrix.arm }}
      ATTEMPT_ID: ${{ matrix.attempt_id }}
      CROSS_PROTOCOL: ${{ inputs.protocol }}
      CPA_JOB_MEMBER: ${{ matrix.instance_id }}-${{ matrix.arm }}
      CPA_SSH_KEY_FILE: ${{ github.workspace }}/.repropatch/ssh/identity
      CPA_SSH_KNOWN_HOSTS_FILE: ${{ github.workspace }}/.repropatch/ssh/known_hosts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 恢复冻结输入与原生执行器
        run: |
          python -m pip install -c requirements/agent.txt -e '.[agent]'
          python scripts/cross_repo_inputs.py --protocol "$CROSS_PROTOCOL" --instance "$INSTANCE"
      - name: 生成统一基线诊断
        run: >-
          python scripts/formal_benchmark.py prepare --protocol "$CROSS_PROTOCOL"
          --instance "$INSTANCE" --arm "$ARM" --output .repropatch/cross-attempt
      - name: 安装专用 SSH 身份
        env:
          SSH_KEY: ${{ secrets.CPA_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPA_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p .repropatch/ssh
          chmod 700 .repropatch/ssh
          printf '%s\n' "$SSH_KEY" > "$CPA_SSH_KEY_FILE"
          printf '%s\n' "$KNOWN_HOSTS" > "$CPA_SSH_KNOWN_HOSTS_FILE"
          chmod 600 "$CPA_SSH_KEY_FILE" "$CPA_SSH_KNOWN_HOSTS_FILE"
      - name: 执行独立冻结尝试与冷 Oracle
        env:
          OPENAI_API_KEY: ${{ secrets.CPA_API_KEY }}
          CPA_LEASE_TOKEN: ${{ secrets.CPA_LEASE_TOKEN }}
        run: >-
          python -u scripts/formal_benchmark.py run --protocol "$CROSS_PROTOCOL"
          --instance "$INSTANCE" --arm "$ARM" --attempt-id "$ATTEMPT_ID"
          --output .repropatch/cross-attempt
      - name: 打包全部执行证据
        if: always()
        run: |
          mkdir -p .repropatch/cross-attempt .repropatch/cross-summary
          cp "$CROSS_PROTOCOL" .repropatch/cross-attempt/protocol.json
          if test -f .repropatch/cross-attempt/summary.json; then cp .repropatch/cross-attempt/summary.json .repropatch/cross-summary/summary.json; fi
          python scripts/actions_benchmark.py pack --source .repropatch/cross-attempt --output .repropatch/cross-attempt.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cross-attempt-${{ github.run_id }}-${{ matrix.instance_id }}-${{ matrix.arm }}
          path: |
            .repropatch/cross-attempt.tar.gz
            .repropatch/cross-attempt.tar.gz.sha256
            .repropatch/cross-attempt.tar.metadata.json
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

      - name: 下载后核验尝试归档 SHA
        if: always()
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cross-attempt-$GITHUB_RUN_ID-$INSTANCE-$ARM" --dir .repropatch/attempt-roundtrip
          python - <<'PY'
          import hashlib, pathlib
          local = pathlib.Path('.repropatch/cross-attempt.tar.gz')
          remote = pathlib.Path('.repropatch/attempt-roundtrip/cross-attempt.tar.gz')
          assert hashlib.file_digest(local.open('rb'), 'sha256').digest() == hashlib.file_digest(remote.open('rb'), 'sha256').digest()
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cross-summary-${{ github.run_id }}-${{ matrix.instance_id }}-${{ matrix.arm }}
          path: .repropatch/cross-summary/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  network-calibration:
    if: inputs.stage == 'calibrate'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      CPA_JOB_MEMBER: calibration
      CPA_SSH_KEY_FILE: ${{ github.workspace }}/.repropatch/ssh/identity
      CPA_SSH_KNOWN_HOSTS_FILE: ${{ github.workspace }}/.repropatch/ssh/known_hosts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 核验完整 CI 与固定 SDK
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$GITHUB_REF_NAME" --limit 20 --json headSha,conclusion > /tmp/cross-ci.json
          python - <<'PY'
          import json, os
          assert any(r['headSha'] == os.environ['GITHUB_SHA'] and r['conclusion'] == 'success' for r in json.load(open('/tmp/cross-ci.json')))
          PY
          python -m pip install -c requirements/agent.txt -e '.[agent]'
      - name: 安装专用 SSH 身份
        env:
          SSH_KEY: ${{ secrets.CPA_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPA_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p .repropatch/ssh
          chmod 700 .repropatch/ssh
          printf '%s\n' "$SSH_KEY" > "$CPA_SSH_KEY_FILE"
          printf '%s\n' "$KNOWN_HOSTS" > "$CPA_SSH_KNOWN_HOSTS_FILE"
          chmod 600 "$CPA_SSH_KEY_FILE" "$CPA_SSH_KNOWN_HOSTS_FILE"
      - name: 十二次请求校准公网与 SSH 路由
        env:
          OPENAI_API_KEY: ${{ secrets.CPA_API_KEY }}
          CPA_LEASE_TOKEN: ${{ secrets.CPA_LEASE_TOKEN }}
        run: python -u scripts/calibrate_cross_network.py --output .repropatch/cross-network-calibration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cross-network-calibration-${{ github.run_id }}
          path: .repropatch/cross-network-calibration/
          include-hidden-files: true
          retention-days: 14

  paid-results:
    needs: [paid-plan, paid-attempt]
    if: always() && needs.paid-plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: cross-summary-${{ github.run_id }}-*
          path: .repropatch/cross-summaries
      - name: 合并已有候选的独立冷评分
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG: ${{ inputs.protocol }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p = json.loads(Path(os.environ['CONFIG']).read_text())
          previous = p.get('prior_attempts', [])
          if previous:
              run = p['prior_rescore_run_id']
              assert type(run) is int
              for row in previous:
                  name = f"cross-rescore-{run}-{row['instance_id']}-{row['arm']}"
                  subprocess.run(['gh', 'run', 'download', str(run), '--repo', os.environ['GITHUB_REPOSITORY'], '--name', name, '--dir', '.repropatch/cross-summaries/' + name], check=True)
          PY
      - run: >-
          python scripts/formal_benchmark.py aggregate --protocol '${{ inputs.protocol }}'
          --source .repropatch/cross-summaries --output .repropatch/cross-results
      - name: 汇总配对差异与仓库宏平均
        run: >-
          python scripts/analyze_cross_repo.py --results .repropatch/cross-results/results.json
          --output .repropatch/cross-results/analysis
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cross-results-${{ github.run_id }}
          path: .repropatch/cross-results/
          include-hidden-files: true
          retention-days: 14
