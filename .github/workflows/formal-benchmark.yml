name: Formal Luna max benchmark
run-name: Luna max · ${{ inputs.authorization == '504' && 'Shell-only 21题' || '四臂 19题' }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: '504：21题 Shell-only，每题24次；912：历史19题四臂，每臂12次'
        required: true
        type: choice
        options: ['912', '504']
        default: '912'

permissions:
  contents: read
  actions: read

concurrency:
  group: formal-luna-max-${{ inputs.authorization }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/src
  FORMAL_PROTOCOL: ${{ inputs.authorization == '504' && 'benchmarks/shell-only-full-protocol.json' || 'benchmarks/formal-max-full-180s-protocol.json' }}

jobs:
  calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check immutable batch and install fixed SDK
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORIZED_REQUESTS: ${{ inputs.authorization }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          if [ "$AUTHORIZED_REQUESTS" = 912 ]; then test "$GITHUB_REF" = refs/heads/main; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/formal-benchmark.yml/runs?event=workflow_dispatch&per_page=100" > /tmp/formal-runs.json
          python - <<'PY'
          import json, os
          runs = json.load(open('/tmp/formal-runs.json'))['workflow_runs']
          assert not any(str(r['id']) != os.environ['GITHUB_RUN_ID'] and r['head_sha'] == os.environ['GITHUB_SHA'] for r in runs), '同一源码批次只执行一次'
          PY
          python -m pip install -c requirements/agent.txt -e '.[agent]'
      - name: Verify frozen supplier max calibration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40199698518 --repo "$GITHUB_REPOSITORY" --name formal-calibration-40199698518 --dir .repropatch/calibration-input
          python scripts/formal_benchmark.py verify-calibration --protocol "$FORMAL_PROTOCOL" --source .repropatch/calibration-input --output .repropatch/calibration
      - name: Verify prior attempts and remaining request allocations
        if: inputs.authorization == '912'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          p = json.load(open(os.environ['FORMAL_PROTOCOL']))
          for entry in p['prior_results']:
              run = str(entry['run_id'])
              subprocess.run(['gh', 'run', 'download', run, '--repo', os.environ['GITHUB_REPOSITORY'], '--name', 'formal-results-' + run, '--dir', '.repropatch/pilot-input/' + run], check=True)
          PY
          python scripts/formal_benchmark.py verify-registry --protocol "$FORMAL_PROTOCOL" --source .repropatch/pilot-input --output .repropatch/calibration/registry-gate
      - name: Freeze task matrix
        id: plan
        env:
          AUTHORIZED_REQUESTS: ${{ inputs.authorization }}
        run: |
          python - <<'PY'
          import json, os
          p = json.load(open(os.environ['FORMAL_PROTOCOL']))
          assert p['formal_request_cap'] == int(os.environ['AUTHORIZED_REQUESTS'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('tasks=' + json.dumps(p['tasks']) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: formal-calibration-${{ github.run_id }}
          path: .repropatch/calibration/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  attempts:
    needs: calibration
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        instance: ${{ fromJSON(needs.calibration.outputs.tasks) }}
    env:
      INSTANCE: ${{ matrix.instance }}
      REPROPATCH_BATCH_ID: formal-${{ github.run_id }}-${{ matrix.instance }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install fixed Agent environment
        run: |
          python -m venv .repropatch/agent-env
          .repropatch/agent-env/bin/python -m pip install -c requirements/agent.txt -e '.[agent]'
      - name: Install legacy comparison frameworks
        if: inputs.authorization == '912'
        run: |
          git init --template= -q .repropatch/mini-source
          git -C .repropatch/mini-source fetch --depth=1 https://github.com/SWE-agent/mini-swe-agent.git 04d809ceab9df28f9adaed044884180159172930
          git -C .repropatch/mini-source checkout --detach FETCH_HEAD
          python -m venv .repropatch/mini-env
          .repropatch/mini-env/bin/python -m pip install -c requirements/formal-mini.txt -e . litellm==1.106.1 httpx2==2.16.0 mcp==2.3.0 mcp-types==2.3.0 rich jinja2 tenacity python-dotenv platformdirs
          MSWEA_SILENT_STARTUP=1 PYTHONPATH=.repropatch/mini-source/src .repropatch/mini-env/bin/python - <<'PY'
          from minisweagent.agents.default import DefaultAgent
          from minisweagent.environments.docker import DockerEnvironment
          from minisweagent.models.litellm_response_model import LitellmResponseModel
          print('固定 mini Agent、Docker 环境与 Responses 模型导入成功')
          PY
          .repropatch/mini-env/bin/python scripts/check_mini_transport.py --mini-source .repropatch/mini-source --output .repropatch/formal-preflight/mini-wire
      - name: Restore frozen qualification and pinned tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40194807297 --repo "$GITHUB_REPOSITORY" --pattern 'evidence-*' --dir .repropatch/qualification-input
          .repropatch/agent-env/bin/python scripts/actions_benchmark.py plan --tasks "$INSTANCE" --mode qualify --parallel 1 --batch "formal-input-$GITHUB_RUN_ID-$INSTANCE" --backend docker --optimization O3 --output .repropatch/input-plan.json
          .repropatch/agent-env/bin/python scripts/actions_benchmark.py prepare --plan .repropatch/input-plan.json --instances "$INSTANCE" --output .repropatch/inputs
          python - <<'PY'
          import base64, hashlib, io, json, pathlib, subprocess, tarfile, urllib.request
          import os
          p = json.load(open(os.environ['FORMAL_PROTOCOL']))
          subprocess.run(['docker', 'pull', p['image']], check=True)
          if 'codex_tarball' not in p:
              raise SystemExit(0)
          data = urllib.request.urlopen(p['codex_tarball'], timeout=120).read()
          assert 'sha512-' + base64.b64encode(hashlib.sha512(data).digest()).decode() == p['codex_tarball_integrity']
          target = pathlib.Path('.repropatch/codex'); target.mkdir()
          with tarfile.open(fileobj=io.BytesIO(data)) as archive: archive.extractall(target, filter='data')
          binary = pathlib.Path(p['codex_binary'])
          assert hashlib.sha256(binary.read_bytes()).hexdigest() == p['codex_sha256']
          assert hashlib.sha256(binary.with_name('codex-code-mode-host').read_bytes()).hexdigest() == p['code_host_sha256']
          PY
      - name: Reconstruct exact task and common baseline without supplier calls
        run: .repropatch/agent-env/bin/python scripts/formal_benchmark.py prepare --protocol "$FORMAL_PROTOCOL" --instance "$INSTANCE" --output .repropatch/formal-output
      - name: Execute registered attempts and score every candidate
        env:
          OPENAI_API_KEY: ${{ secrets.CPA_API_KEY }}
        run: .repropatch/agent-env/bin/python -u scripts/formal_benchmark.py run --protocol "$FORMAL_PROTOCOL" --instance "$INSTANCE" --output .repropatch/formal-output
      - name: Preserve raw evidence
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, shutil
          root = pathlib.Path('.repropatch/formal-output'); root.mkdir(exist_ok=True)
          if pathlib.Path('.repropatch/formal-preflight').is_dir():
              shutil.copytree('.repropatch/formal-preflight', root / 'preflight')
          (root / 'runner-status.json').write_text(json.dumps({'job_status': '${{ job.status }}', 'instance': '${{ matrix.instance }}'}))
          for name in ['summary.json', 'protocol.json', 'usage.sqlite3']:
              if (root / name).is_file():
                  target = pathlib.Path('.repropatch/summary'); target.mkdir(exist_ok=True)
                  (target / name).write_bytes((root / name).read_bytes())
          PY
          .repropatch/agent-env/bin/python scripts/actions_benchmark.py pack --source .repropatch/formal-output --output .repropatch/formal-evidence.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: formal-evidence-${{ github.run_id }}-${{ matrix.instance }}
          path: |
            .repropatch/formal-evidence.tar.gz
            .repropatch/formal-evidence.tar.gz.sha256
            .repropatch/formal-evidence.tar.metadata.json
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: formal-summary-${{ github.run_id }}-${{ matrix.instance }}
          path: .repropatch/summary/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    needs: [calibration, attempts]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: formal-summary-${{ github.run_id }}-*
          path: .repropatch/summaries
      - run: |
          python scripts/formal_benchmark.py aggregate --protocol "$FORMAL_PROTOCOL" --source .repropatch/summaries --output .repropatch/results
          cat .repropatch/results/results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: formal-results-${{ github.run_id }}
          path: .repropatch/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
