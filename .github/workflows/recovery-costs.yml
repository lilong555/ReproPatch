name: Fresh checkpoint recovery costs

on:
  workflow_call:
    inputs:
      protocol:
        type: string
        required: false
        default: benchmarks/recovery-costs-20261107/live-protocol.json
    secrets:
      CPA_API_KEY:
        required: true
      CPA_SSH_PRIVATE_KEY:
        required: true
      CPA_SSH_KNOWN_HOSTS:
        required: true
      CPA_LEASE_TOKEN:
        required: true

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts
  RECOVERY_PROTOCOL: ${{ inputs.protocol }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install fixed runtime and test dependencies
        run: python -m pip install -c requirements/agent.txt -e '.[agent,dev,semantic]'
      - name: Verify recovery accounting and queue contracts
        run: >-
          python -m pytest -q tests/test_recovery_costs.py
          tests/test_resume.py tests/test_cpa_route.py tests/test_localization_cpa.py
      - name: Validate predecessor and frozen pairs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from run_recovery_pair import manifest
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
          p = manifest(Path(os.environ['RECOVERY_PROTOCOL']))
          predecessor = json.loads(subprocess.check_output([
              'gh', 'run', 'view', str(p['queue_after_run']),
              '--repo', os.environ['GITHUB_REPOSITORY'], '--json', 'status,conclusion,url',
          ]))
          assert predecessor['status'] == 'completed', predecessor
          assert len(p['pairs']) == 4 and p['max_actual_requests'] == 180
          assert p['cpa_max_reserved_requests'] == 192
          Path('.repropatch').mkdir(exist_ok=True)
          Path('.repropatch/recovery-predecessor.json').write_text(
              json.dumps(predecessor, indent=2) + '\n'
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('matrix=' + json.dumps({'include': p['pairs']}) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-plan-${{ github.run_id }}
          path: |
            ${{ inputs.protocol }}
            .repropatch/recovery-predecessor.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  pair:
    name: ${{ matrix.pair_id }} / ${{ matrix.instance_id }} / r${{ matrix.repeat }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PAIR_ID: ${{ matrix.pair_id }}
      CPA_JOB_MEMBER: ${{ matrix.pair_id }}
      CPA_SSH_KEY_FILE: ${{ github.workspace }}/.repropatch/ssh/identity
      CPA_SSH_KNOWN_HOSTS_FILE: ${{ github.workspace }}/.repropatch/ssh/known_hosts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install fixed native Agent environment
        run: python -m pip install -c requirements/agent.txt -e '.[agent,semantic]'
      - name: Prepare frozen official C++ task and qualification
        id: prepare
        run: >-
          python -u scripts/run_recovery_pair.py prepare
          --protocol "$RECOVERY_PROTOCOL" --pair "$PAIR_ID"
          --output .repropatch/recovery/prepared
      - name: Install dedicated SSH identity
        env:
          SSH_KEY: ${{ secrets.CPA_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPA_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 .repropatch/ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > "$CPA_SSH_KEY_FILE"
          printf '%s\n' "$KNOWN_HOSTS" > "$CPA_SSH_KNOWN_HOSTS_FILE"
      - name: Measure fresh prefix, resume and matched restart with cold scoring
        id: execute
        env:
          OPENAI_API_KEY: ${{ secrets.CPA_API_KEY }}
          CPA_LEASE_TOKEN: ${{ secrets.CPA_LEASE_TOKEN }}
        run: >-
          python -u scripts/run_recovery_pair.py execute
          --protocol "$RECOVERY_PROTOCOL" --pair "$PAIR_ID"
          --prepared .repropatch/recovery/prepared
          --output .repropatch/recovery/execution
      - name: Preserve every pair and workflow outcome
        if: always()
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          RUNNER_JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from benchmark_budget import LocalUsageLedger
          from run_recovery_pair import selected_pairs
          p = json.loads(Path(os.environ['RECOVERY_PROTOCOL']).read_text())
          pair = selected_pairs(p, os.environ['PAIR_ID'])[0]
          raw = Path('.repropatch/recovery')
          raw.mkdir(parents=True, exist_ok=True)
          summary = Path('.repropatch/recovery-summary')
          summary.mkdir(parents=True, exist_ok=True)
          result = raw / 'execution' / pair['pair_id'] / 'pair.json'
          row = json.loads(result.read_text()) if result.is_file() else {
              **pair, 'status': 'workflow_failed',
          }
          row.setdefault('attempt_usage', {})
          for arm in ('resume', 'restart'):
              ledger = raw / 'execution' / pair['pair_id'] / (arm + '-usage.sqlite3')
              if ledger.is_file():
                  row['attempt_usage'][arm] = LocalUsageLedger(ledger).summary(pair[arm + '_attempt'])
              score = raw / 'execution' / pair['pair_id'] / (arm + '-score') / 'score.json'
              if score.is_file() and arm + '_score' not in row:
                  row[arm + '_score'] = {'score': json.loads(score.read_text())}
          row['workflow'] = {
              'source_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'prepare': os.environ['PREPARE_OUTCOME'], 'execute': os.environ['EXECUTE_OUTCOME'],
              'status': os.environ['RUNNER_JOB_STATUS'],
              'raw_artifact': 'recovery-raw-' + os.environ['GITHUB_RUN_ID'] + '-' + pair['pair_id'],
              'raw_artifacts_url': 'https://github.com/' + os.environ['GITHUB_REPOSITORY']
                  + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '#artifacts',
          }
          for directory in (raw, summary):
              (directory / 'pair.json').write_text(json.dumps(row, indent=2) + '\n')
          shutil.copyfile(os.environ['RECOVERY_PROTOCOL'], raw / 'protocol.json')
          PY
      - name: Archive complete raw records and file hashes
        if: always()
        run: >-
          python scripts/actions_benchmark.py pack
          --source .repropatch/recovery --output .repropatch/recovery.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recovery-raw-${{ github.run_id }}-${{ matrix.pair_id }}
          path: |
            .repropatch/recovery.tar.gz
            .repropatch/recovery.tar.gz.sha256
            .repropatch/recovery.tar.metadata.json
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recovery-summary-${{ github.run_id }}-${{ matrix.pair_id }}
          path: .repropatch/recovery-summary/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  aggregate:
    if: always() && needs.plan.result == 'success'
    needs: [plan, pair]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: recovery-summary-${{ github.run_id }}-*
          path: .repropatch/recovery-summaries
      - name: Aggregate successes, costs, failures and missing pairs
        run: >-
          python scripts/run_recovery_pair.py aggregate --protocol "$RECOVERY_PROTOCOL"
          --input .repropatch/recovery-summaries --output .repropatch/recovery-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-results-${{ github.run_id }}
          path: .repropatch/recovery-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
