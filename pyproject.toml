[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repropatch"
version = "0.1.0"
description = "A reproducible repair agent harness for C++ projects"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
repropatch = "repropatch.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["docker: requires a real Docker daemon and the repropatch image", "integration: compiles the trusted C++ fixture"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
